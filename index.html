  <script>
    // Se arriviamo dopo il redirect di 404.html, ripristiniamo il path richiesto
    (function () {
      try {
        var p = sessionStorage.getItem('redirectPath');
        if (p) {
          sessionStorage.removeItem('redirectPath');
          var newUrl = (p.startsWith('/') ? p : '/' + p);
          if (location.pathname !== newUrl) history.replaceState(null, '', newUrl);
        }
      } catch (e) { }
    })();
  </script>
